services:
  mysql:
    image: mysql:8.4
    container_name: widgets_studio_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-widgets_studio}
      MYSQL_USER: ${MYSQL_USER:-widgets_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-widgets_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
